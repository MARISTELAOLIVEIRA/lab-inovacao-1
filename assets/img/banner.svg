<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Laboratório de Inovação I · A bússola da carreira · Profa. Maristela · Senac DF</title>
  <desc id="descricao">Banner: o título em verde-limão e violeta, ao lado de uma bússola cujos quatro pontos são autoconhecimento, relações humanas, carreira e impacto social, com a agulha apontando para a carreira.</desc>

  <defs>
    <!-- Brilhos do fundo: violeta à esquerda, verde-limão à direita -->
    <radialGradient id="brilhoVioleta" cx="6%" cy="15%" r="65%">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".45"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoLima" cx="80%" cy="105%" r="55%">
      <stop offset="0" stop-color="#A3E635" stop-opacity=".22"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>
    <!-- Trilhas de placa de circuito, bem apagadas -->
    <pattern id="placa" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 30 H22 L30 22 V0 M60 40 H42 L36 46 V60" fill="none" stroke="#A78BFA" stroke-opacity=".08" stroke-width="2"/>
      <circle cx="30" cy="22" r="3" fill="#A78BFA" fill-opacity=".12"/>
      <circle cx="36" cy="46" r="3" fill="#A78BFA" fill-opacity=".12"/>
    </pattern>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="borrado"/>
      <feMerge><feMergeNode in="borrado"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="360" rx="18" fill="#141A2B"/>
  <rect width="1200" height="360" rx="18" fill="url(#placa)"/>
  <rect width="1200" height="360" rx="18" fill="url(#brilhoVioleta)"/>
  <rect width="1200" height="360" rx="18" fill="url(#brilhoLima)"/>

  <!-- Título -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="88" font-size="21" fill="#A9B3CC" letter-spacing="3">ADS · 1º SEMESTRE · SENAC DF</text>
    <text x="62" y="158" font-size="66" font-weight="800" fill="#A3E635" filter="url(#neon)">A bússola</text>
    <text x="62" y="228" font-size="66" font-weight="800" fill="#C4B5FD" filter="url(#neon)">da carreira</text>
    <text x="64" y="276" font-size="22" fill="#E2E8F0">Aqui o projeto é você: do autoconhecimento</text>
    <text x="64" y="306" font-size="22" fill="#E2E8F0">ao primeiro estágio, com uma ação social no meio.</text>
  </g>

  <!-- Janela com a bússola -->
  <g transform="translate(660 40)">
    <rect width="480" height="280" rx="12" fill="#0F1424" stroke="#2E3656" stroke-width="2"/>
    <rect width="480" height="38" rx="12" fill="#1B2238"/>
    <rect y="26" width="480" height="12" fill="#1B2238"/>
    <circle cx="22" cy="19" r="7" fill="#FF5F57"/>
    <circle cx="44" cy="19" r="7" fill="#FEBC2E"/>
    <circle cx="66" cy="19" r="7" fill="#28C840"/>
    <text x="240" y="25" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#A9B3CC">bussola.apontar("carreira")</text>

    <!-- Bússola -->
    <g transform="translate(240 160)">
      <circle r="84" fill="#141A2B" stroke="#A78BFA" stroke-width="3"/>
      <circle r="64" fill="none" stroke="#A78BFA" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 6"/>
      <g stroke="#A78BFA" stroke-width="3" stroke-linecap="round">
        <path d="M0 -84 V-71 M0 84 V71 M-84 0 H-71 M84 0 H71"/>
      </g>
      <g stroke="#A78BFA" stroke-opacity=".6" stroke-width="2" stroke-linecap="round">
        <path d="M59 -59 L52 -52 M-59 -59 L-52 -52 M59 59 L52 52 M-59 59 L-52 52"/>
      </g>
      <!-- Agulha: a ponta verde aponta para a carreira (leste) -->
      <g transform="rotate(80)">
        <path d="M0 -60 L10 0 L-10 0 Z" fill="#A3E635" filter="url(#neon)"/>
        <path d="M0 60 L10 0 L-10 0 Z" fill="#E2E8F0" opacity=".85"/>
      </g>
      <circle r="6" fill="#141A2B" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Os quatro pontos cardeais da disciplina -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="15">
      <text x="240" y="64" text-anchor="middle" fill="#C4B5FD">N · autoconhecimento</text>
      <text x="240" y="266" text-anchor="middle" fill="#C4B5FD">S · impacto social</text>
      <text x="20" y="152" fill="#C4B5FD">O · relações</text>
      <text x="20" y="172" fill="#C4B5FD">humanas</text>
      <text x="460" y="152" text-anchor="end" fill="#A3E635" font-weight="bold">L · carreira</text>
      <text x="460" y="172" text-anchor="end" fill="#A3E635">você está aqui</text>
    </g>
  </g>
</svg>
